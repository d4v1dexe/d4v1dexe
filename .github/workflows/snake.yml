name: Generate snake animation

on:
  schedule:
    # Once a day. The contribution graph only changes daily, so more is waste.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Needed to push the generated images to the `output` branch.
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Committed to a separate `output` branch so the images are served from
      # this repo. Nothing third-party is called when someone views the profile.
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
