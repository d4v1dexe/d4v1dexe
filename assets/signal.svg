<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="An animated ECG-style signal trace">
  <title>signal</title>

  <defs>
    <!-- Oscilloscope-paper grid. Neutral grey so it reads on light and dark. -->
    <pattern id="grid-sm" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#8b949e" stroke-width="0.5" opacity="0.18"/>
    </pattern>
    <pattern id="grid-lg" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="url(#grid-sm)"/>
      <path d="M 90 0 L 0 0 0 90" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.30"/>
    </pattern>

    <!-- Fade the trace out at both edges so it reads as a continuous stream. -->
    <linearGradient id="edge-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"    stop-color="white" stop-opacity="0"/>
      <stop offset="0.08" stop-color="white" stop-opacity="1"/>
      <stop offset="0.92" stop-color="white" stop-opacity="1"/>
      <stop offset="1"    stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade-mask">
      <rect width="900" height="180" fill="url(#edge-fade)"/>
    </mask>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One full sweep of the waveform. Reused by the trace and the dot. -->
    <path id="wave"
      d="M 0,90
         L 60,90 L 72,90 L 78,74 L 84,106 L 90,90 L 110,90
         L 124,90 L 130,88 L 140,44 L 150,132 L 158,84 L 166,90 L 190,90
         L 210,90 L 220,90 L 232,78 L 246,96 L 258,90 L 300,90
         L 330,90 L 342,90 L 348,74 L 354,106 L 360,90 L 380,90
         L 394,90 L 400,88 L 410,44 L 420,132 L 428,84 L 436,90 L 460,90
         L 480,90 L 490,90 L 502,78 L 516,96 L 528,90 L 570,90
         L 600,90 L 612,90 L 618,74 L 624,106 L 630,90 L 650,90
         L 664,90 L 670,88 L 680,44 L 690,132 L 698,84 L 706,90 L 730,90
         L 750,90 L 760,90 L 772,78 L 786,96 L 798,90 L 900,90"/>
  </defs>

  <style>
    /* Declarative CSS only - no script. Runs fine when the SVG is loaded as an image. */
    .trace {
      fill: none;
      stroke: #3fb950;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 2600;
      stroke-dashoffset: 2600;
      animation: draw 7s linear infinite;
    }
    .trace-ghost {
      fill: none;
      stroke: #3fb950;
      stroke-width: 2.5;
      opacity: 0.18;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 2600; }
      70%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .baseline { stroke: #8b949e; stroke-width: 1; opacity: 0.35; stroke-dasharray: 4 6; }
    .label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      fill: #8b949e;
      letter-spacing: 2px;
    }
  </style>

  <rect width="900" height="180" fill="url(#grid-lg)" mask="url(#fade-mask)"/>
  <line x1="0" y1="90" x2="900" y2="90" class="baseline" mask="url(#fade-mask)"/>

  <g mask="url(#fade-mask)">
    <use href="#wave" class="trace-ghost"/>
    <use href="#wave" class="trace" filter="url(#glow)"/>

    <!-- Probe dot riding the waveform. SMIL, which animates in image context. -->
    <circle r="4" fill="#3fb950" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
        <mpath href="#wave"/>
      </animateMotion>
    </circle>
  </g>

  <text x="24" y="28" class="label">SIGNAL ANALYSIS</text>
  <text x="876" y="162" class="label" text-anchor="end">d4v1dexe</text>
</svg>
